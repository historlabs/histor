[project]
name = "histor"
version = "0.1.0"
description = "Offline verifier and evidence formats for EU AI Act Article 57 regulatory sandboxes"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Histor Labs", email = "hello@historlabs.eu" }]
maintainers = [{ name = "Histor Labs", email = "hello@historlabs.eu" }]
keywords = ["EU AI Act", "regulatory sandbox", "Article 57", "evidence", "verification", "in-toto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
# The core only: what `histor verify` and `histor plan validate` import.
dependencies = [
    "asn1crypto>=1.5",
    "cryptography>=50.0.1",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "rfc3339-validator>=0.1.4",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.urls]
Homepage = "https://historlabs.eu"
Repository = "https://github.com/historlabs/histor"
Issues = "https://github.com/historlabs/histor/issues"
Security = "https://github.com/historlabs/histor/security/policy"

[project.scripts]
histor = "histor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["histor"]

[tool.hatch.build.targets.wheel.force-include]
# The plan schema is read at run time (histor/crypto/resources.py). A checkout reads it
# from spec/; an installed wheel carries a copy under histor/_data.
"spec" = "histor/_data/spec"

[tool.hatch.build.targets.sdist]
include = [
    "histor",
    "spec",
    "docs",
    "examples",
    "tests",
    "README.md",
    "LICENSE",
    "SECURITY.md",
    "CONTRIBUTING.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["histor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
