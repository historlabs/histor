name: Release

# A tag `v*` is a release. What is published is what anyone can check without taking
# this repository's word for it:
#
#   * the wheel and sdist, built from the tagged commit, and tested as installed;
#   * SLSA build provenance for each (actions/attest-build-provenance);
#   * a keyless Sigstore signature on each release file, whose certificate names this
#     workflow at this tag, and SHA256SUMS;
#   * a GitHub Release with those files;
#   * the same wheel and sdist on PyPI, through a trusted publisher, when the repository
#     variable PUBLISH_TO_PYPI is "true" and the `pypi` environment exists.
#
# Every action is pinned by commit, with its version beside it; permissions are none by
# default and granted per job.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COSIGN_VERSION: v3.0.6

jobs:
  dist:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # provenance (Sigstore)
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # A release is built from nothing cached: a poisoned cache must not reach it.
          enable-cache: false

      - name: The tag names the version in pyproject.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv build --out-dir dist --no-cache

      - name: Test the built wheel, installed
        run: |
          uv venv --no-cache --python 3.12 "$RUNNER_TEMP/wheel-env"
          uv pip install --no-cache --python "$RUNNER_TEMP/wheel-env" dist/*.whl pytest
          # Only the installed package is importable: the tests run from a copy of
          # tests/ and examples/ outside the checkout.
          cp -r tests examples "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pytest -q -p no:cacheprovider tests
          "$RUNNER_TEMP/wheel-env/bin/histor" verify examples/sample-participation/evidence-bundle

      - name: Provenance of the wheel and sdist
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # keyless signatures on the release files
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.dist.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: assets

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: SHA256SUMS and signatures
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$VERSION" in *[a-z]*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --generate-notes "${flags[@]}" assets/*

  pypi:
    name: PyPI
    needs: [dist, release]
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
